  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

8,73,.97); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:space-between; gap:16px; padding:11px 22px; font-family:'Montserrat',sans-serif;\">\n  <span style=\"font-family:'Josefin Sans',sans-serif; font-weight:700; font-size:14px; letter-spacing:.04em; color:#fff; white-space:nowrap;\">Company Filters · Print<\u002Fspan>\n  <button onclick=\"{{ doPrint }}\" style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:12px; letter-spacing:.04em; background:#111; border:1.5px solid #111; border-radius:7px; padding:8px 16px; cursor:pointer; color:#fff;\">Print / Save PDF<\u002Fbutton>\n<\u002Fdiv>\n\n<div id=\"ws-root\" style=\"background:#fff; color:#111; font-family:'Lato',sans-serif; max-width:880px; margin:26px auto; padding:0 0 70px; box-shadow:0 2px 24px rgba(0,48,73,.10); box-sizing:border-box; overflow:hidden;\">\n\n  <!-- MASTHEAD -->\n  <div style=\"padding:42px 64px 28px; border-bottom:3px solid #111;\">\n    <div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:12px; letter-spacing:.26em; text-transform:uppercase; color:#555;\">Chapter 1 · Worksheet<\u002Fdiv>\n    <h1 style=\"font-family:'Josefin Sans',sans-serif; font-weight:700; font-size:40px; line-height:1.06; white-space:nowrap; margin:14px 0 0; color:#111;\">Find Your <span style=\"text-decoration:line-through; text-decoration-color:#111; text-decoration-thickness:4px; color:#888;\">Dream<\u002Fspan> <span style=\"font-family:'Fraunces',serif; font-style:italic; font-weight:600; color:#111;\">Pretty Good<\u002Fspan> Job<\u002Fh1>\n    <div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:#333; margin:16px 0 0;\">Company Filters<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:34px 64px 0;\">\n    <p style=\"font-family:'Fraunces',serif; font-size:17px; line-height:1.58; margin:0;\">Salary is the benefit we think about the most, but there are many options. Give each benefit an acceptable range so that you can compare full packages. The premise is that if a job hits lower in the range in one benefit, they should hit higher in the range for another area. If this is not a benefit that interests you or is relevant to where you live (like retirement benefits), you can leave it blank and not use it as a filter.<\u002Fp>\n    <p style=\"font-size:14.5px; line-height:1.62; color:#333; margin:16px 0 0;\">Many companies use “Cost of Labor” to help them identify the minimal amount of a benefit to offer, so the region you want to work in matters. AI can help you quickly change the question to different regions and collate that data.<\u002Fp>\n\n    <!-- STEP 1 -->\n    <div class=\"step\">\n      <div style=\"display:flex; align-items:baseline; gap:13px; margin:38px 0 0;\">\n        <span style=\"font-family:'Bebas Neue',sans-serif; font-size:38px; line-height:.78; color:#666;\">01<\u002Fspan>\n        <h2 style=\"font-family:'Fraunces',serif; font-weight:600; font-size:24px; color:#111; margin:0;\">Set Your Ranges<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:3px; width:54px; background:#111; margin:12px 0 16px;\"><\u002Fdiv>\n      <p style=\"font-size:14px; line-height:1.55; color:#444; margin:0 0 4px;\">Use AI to find realistic market ranges before you fill these in. Swap in your region, target benefit, and years of experience.<\u002Fp>\n\n      <div style=\"background:#f2f2f2; border-left:3px solid #111; border-radius:0 4px 4px 0; padding:12px 15px; margin:16px 0;\">\n        <div style=\"font-family:'Montserrat',sans-serif; font-weight:700; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#111; margin-bottom:6px;\">◇ AI Prompt<\u002Fdiv>\n        <div style=\"font-family:'Lato',sans-serif; font-size:13px; line-height:1.5; color:#333;\">“In [region], what is the average range of [benefit] for a senior software engineer with [N] years of experience? What about in [other region]?”<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; padding:0 0 7px; border-bottom:2px solid #111; font-family:'Montserrat',sans-serif; font-weight:700; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#777;\">\n        <div>Benefit<\u002Fdiv>\n        <div>Your acceptable range<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:end; padding:11px 0; border-bottom:1px solid #eeeeee;\"><div><div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px; color:#111;\">Cash salary<\u002Fdiv><div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:11px; color:#777; margin-top:2px;\">Example: $250–300,000<\u002Fdiv><\u002Fdiv><div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:end; padding:11px 0; border-bottom:1px solid #eeeeee;\"><div><div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px; color:#111;\">Vacation days<\u002Fdiv><div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:11px; color:#777; margin-top:2px;\">Example: 4–6 weeks<\u002Fdiv><\u002Fdiv><div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:end; padding:11px 0; border-bottom:1px solid #eeeeee;\"><div><div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px; color:#111;\">401(k) match<\u002Fdiv><div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:11px; color:#777; margin-top:2px;\">Example: 1–4%<\u002Fdiv><\u002Fdiv><div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:end; padding:11px 0; border-bottom:1px solid #eeeeee;\"><div><div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px; color:#111;\">Equity<\u002Fdiv><div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:11px; color:#777; margin-top:2px;\">Example: 0.1%–0.5%<\u002Fdiv><\u002Fdiv><div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:end; padding:11px 0; border-bottom:1px solid #eeeeee;\"><div><div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px; color:#111;\">Stock options<\u002Fdiv><div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:11px; color:#777; margin-top:2px;\">Example: 5–15,000 shares at current price, vesting 5 years, 1-year cliff<\u002Fdiv><\u002Fdiv><div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:end; padding:11px 0; border-bottom:1px solid #eeeeee;\"><div><div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px; color:#111;\">RSUs<\u002Fdiv><div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:11px; color:#777; margin-top:2px;\">Example: $100–200,000 over 4 years, available yearly<\u002Fdiv><\u002Fdiv><div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:end; padding:11px 0; border-bottom:1px solid #eeeeee;\"><div><div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px; color:#111;\">Cash bonuses<\u002Fdiv><div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:11px; color:#777; margin-top:2px;\">Example: hiring bonus, yearly performance percentage, or others<\u002Fdiv><\u002Fdiv><div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:end; padding:11px 0; border-bottom:1px solid #eeeeee;\"><div><div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px; color:#111;\">Other retirement<\u002Fdiv><div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:11px; color:#777; margin-top:2px;\">Example: pensions, superannuation, RRSP, provident fund<\u002Fdiv><\u002Fdiv><div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:end; padding:11px 0; border-bottom:1px solid #eeeeee;\"><div><div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px; color:#111;\">Meals<\u002Fdiv><div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:11px; color:#777; margin-top:2px;\">Example: 0–3 per day<\u002Fdiv><\u002Fdiv><div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:end; padding:11px 0; border-bottom:1px solid #eeeeee;\"><div><div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px; color:#111;\">Child care<\u002Fdiv><div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:11px; color:#777; margin-top:2px;\">Example: on-site / subsidized / none<\u002Fdiv><\u002Fdiv><div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:end; padding:11px 0; border-bottom:1px solid #eeeeee;\"><div style=\"border-bottom:1.5px solid #c9c9c9; height:22px;\"><\u002Fdiv><div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:200px 1fr; gap:16px; align-items:end; padding:11px 0; border-bottom:1px solid #eeeeee;\"><div style=\"border-bottom:1.5px solid #c9c9c9; height:22px;\"><\u002Fdiv><div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- STEP 2 -->\n    <div class=\"step\">\n      <div style=\"display:flex; align-items:baseline; gap:13px; margin:44px 0 0;\">\n        <span style=\"font-family:'Bebas Neue',sans-serif; font-size:38px; line-height:.78; color:#666;\">02<\u002Fspan>\n        <h2 style=\"font-family:'Fraunces',serif; font-weight:600; font-size:24px; color:#111; margin:0;\">Rank Your Top Three<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:3px; width:54px; background:#111; margin:12px 0 16px;\"><\u002Fdiv>\n      <p style=\"font-size:14px; line-height:1.55; color:#444; margin:0 0 16px;\">You can’t optimize for everything. Pull the three benefits that matter the most to you. These will become the filters you apply to the company list.<\u002Fp>\n      <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:16px;\"><span style=\"font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1; color:#666; width:20px;\">1<\u002Fspan><div style=\"flex:1; border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:16px;\"><span style=\"font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1; color:#666; width:20px;\">2<\u002Fspan><div style=\"flex:1; border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:16px;\"><span style=\"font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1; color:#666; width:20px;\">3<\u002Fspan><div style=\"flex:1; border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- STEP 3 -->\n    <div class=\"step\">\n      <div style=\"display:flex; align-items:baseline; gap:13px; margin:44px 0 0;\">\n        <span style=\"font-family:'Bebas Neue',sans-serif; font-size:38px; line-height:.78; color:#666;\">03<\u002Fspan>\n        <h2 style=\"font-family:'Fraunces',serif; font-weight:600; font-size:24px; color:#111; margin:0;\">Culture Filters<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:3px; width:54px; background:#111; margin:12px 0 16px;\"><\u002Fdiv>\n      <p style=\"font-size:14px; line-height:1.55; color:#444; margin:0 0 20px;\">These filters are the “how” of work instead of the “what” of industries. If any other cultural filter is important to you but not listed, add that in.<\u002Fp>\n\n      <div style=\"margin-bottom:20px;\">\n        <div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:14px; color:#111;\">Where do I want to work?<\u002Fdiv>\n        <div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:12.5px; color:#777; margin:3px 0 8px;\">Remote / Hybrid / On-Site<\u002Fdiv>\n        <div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-bottom:20px;\">\n        <div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:14px; color:#111;\">If not remote, where can the company be located? Would I move to work for this company?<\u002Fdiv>\n        <div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:12.5px; color:#777; margin:3px 0 8px;\">Examples: Any city. Only American East Coast cities. Anywhere in Japan. Anywhere in the world. Only English-speaking countries. Only within 100 miles of x location.<\u002Fdiv>\n        <div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-bottom:20px;\">\n        <div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:14px; color:#111;\">How much travel do I want to do?<\u002Fdiv>\n        <div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:12.5px; color:#777; margin:3px 0 8px;\">Examples: Zero, I am a caretaker who needs to be home. Once a quarter, for company meetings or educational opportunities. All the time, I love traveling and want it to be part of my job.<\u002Fdiv>\n        <div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-bottom:20px;\">\n        <div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:14px; color:#111;\">How much growth are you looking for?<\u002Fdiv>\n        <div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:12.5px; color:#777; margin:3px 0 8px;\">Examples: Fast-paced, constantly changing. Stable, but steady growth. Slow growth, but strong job security.<\u002Fdiv>\n        <div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-bottom:20px;\">\n        <div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:14px; color:#111;\">How much does work/life balance matter right now?<\u002Fdiv>\n        <div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:12.5px; color:#777; margin:3px 0 8px;\">Examples: Very much, I would like to work a steady 40 hours per week. Not at all, I am looking to put my all into the company. In the middle, I can be on call and do some weekends, but generally a 40-hour week.<\u002Fdiv>\n        <div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-bottom:20px;\">\n        <div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:14px; color:#111;\">Company Size<\u002Fdiv>\n        <div style=\"font-family:'Fraunces',serif; font-style:italic; font-size:12.5px; color:#777; margin:3px 0 8px;\">Examples: Startup, Small Business (&lt;100), Medium Business (100 – 1500), Large Business (1500+)<\u002Fdiv>\n        <div style=\"border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-bottom:20px;\">\n        <div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:14px; color:#111;\">Other cultural filter<\u002Fdiv>\n        <div style=\"border-bottom:1.5px solid #c9c9c9; height:26px; margin-top:8px;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- STEP 4 -->\n    <div class=\"step\">\n      <div style=\"display:flex; align-items:baseline; gap:13px; margin:44px 0 0;\">\n        <span style=\"font-family:'Bebas Neue',sans-serif; font-size:38px; line-height:.78; color:#666;\">04<\u002Fspan>\n        <h2 style=\"font-family:'Fraunces',serif; font-weight:600; font-size:24px; color:#111; margin:0;\">Rank Your Top Three<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:3px; width:54px; background:#111; margin:12px 0 16px;\"><\u002Fdiv>\n      <p style=\"font-size:14px; line-height:1.55; color:#444; margin:0 0 16px;\">You can’t optimize for everything. Pull the three culture filters that matter the most to you. These will become the filters you apply to the company list.<\u002Fp>\n      <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:16px;\"><span style=\"font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1; color:#666; width:20px;\">1<\u002Fspan><div style=\"flex:1; border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:16px;\"><span style=\"font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1; color:#666; width:20px;\">2<\u002Fspan><div style=\"flex:1; border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:16px;\"><span style=\"font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1; color:#666; width:20px;\">3<\u002Fspan><div style=\"flex:1; border-bottom:1.5px solid #c9c9c9; height:26px;\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- STEP 5 -->\n    <div class=\"step\">\n      <div style=\"display:flex; align-items:baseline; gap:13px; margin:44px 0 0;\">\n        <span style=\"font-family:'Bebas Neue',sans-serif; font-size:38px; line-height:.78; color:#666;\">05<\u002Fspan>\n        <h2 style=\"font-family:'Fraunces',serif; font-weight:600; font-size:24px; color:#111; margin:0;\">Hard Dealbreakers<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:3px; width:54px; background:#111; margin:12px 0 16px;\"><\u002Fdiv>\n      <p style=\"font-size:14px; line-height:1.55; color:#444; margin:0 0 6px;\">Lines you would never cross. Each one should start with “I would never…”. Unlike the ranges above, these are non-negotiable.<\u002Fp>\n      <p style=\"font-family:'Fraunces',serif; font-style:italic; font-size:12px; color:#777; margin:0 0 16px;\">Examples: “I would never work for a political campaign.” · “I would never work fully on-site.” · “I would never work in a vice-focused industry.”<\u002Fp>\n      <div style=\"border-bottom:1.5px solid #c9c9c9; height:26px; margin-bottom:16px;\"><\u002Fdiv>\n      <div style=\"border-bottom:1.5px solid #c9c9c9; height:26px; margin-bottom:16px;\"><\u002Fdiv>\n      <div style=\"border-bottom:1.5px solid #c9c9c9; height:26px; margin-bottom:16px;\"><\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals(){\n    return { doPrint: () => window.print() };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
