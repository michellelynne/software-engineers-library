document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ign-items:baseline; gap:12px; min-width:0;\">\n    <span style=\"font-family:'Josefin Sans',sans-serif; font-weight:700; font-size:14px; letter-spacing:.04em; color:#fff; white-space:nowrap;\">Organization Context<\u002Fspan>\n    <span id=\"ws-count\" style=\"font-size:12px; color:#9178B5; white-space:nowrap;\">0 of 20 answered<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex; gap:9px;\">\n    <button onclick=\"{{ clearAll }}\" style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:12px; letter-spacing:.04em; color:#cfe0e2; background:transparent; border:1.5px solid #2d5266; border-radius:7px; padding:8px 14px; cursor:pointer;\">Clear<\u002Fbutton>\n    <button onclick=\"{{ doPrint }}\" style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:12px; letter-spacing:.04em; background:#177E89; border:1.5px solid #177E89; border-radius:7px; padding:8px 16px; cursor:pointer; color:#fff;\">Print / Save PDF<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"ws-root\" style=\"background:#fff; color:#3A2449; font-family:'Lato',sans-serif; max-width:880px; margin:26px auto; padding:0 0 70px; box-shadow:0 2px 24px rgba(0,48,73,.10); box-sizing:border-box; overflow:hidden;\">\n\n  <!-- MASTHEAD -->\n  <div id=\"ws-masthead\" style=\"background:#3A2449; color:#fff; padding:42px 64px 38px;\">\n    <div style=\"font-family:'Montserrat',sans-serif; font-weight:600; font-size:12px; letter-spacing:.26em; text-transform:uppercase; color:#bda9d4;\">Chapter 2 · Worksheet<\u002Fdiv>\n    <h1 style=\"font-family:'Fraunces',serif; font-weight:700; font-size:46px; line-height:1.0; margin:14px 0 0; color:#fff;\">Organization Context<\u002Fh1>\n    <div style=\"height:3px; width:64px; background:#DB3A34; margin:20px 0 0;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:34px 64px 0;\">\n    <!-- CONFIDENTIALITY NOTICE -->\n    <div style=\"border:1.5px solid #DB3A34; border-radius:6px; padding:16px 18px; display:flex; gap:14px; align-items:flex-start;\">\n      <span style=\"font-family:'Bebas Neue',sans-serif; font-size:30px; line-height:.8; color:#DB3A34; flex:none;\">!<\u002Fspan>\n      <div>\n        <div style=\"font-family:'Montserrat',sans-serif; font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#DB3A34; margin-bottom:5px;\">Treat this as a work document<\u002Fdiv>\n        <p style=\"font-size:13.5px; line-height:1.55; color:#3A2449; margin:0;\">Unlike the other worksheets in this book, this one is entirely about your current place of work, so it should be treated like a work document. Any information you gather from internal documentation is confidential. Rather than typing answers into this page, use <strong>Print / Save PDF<\u002Fstrong> to make a copy, and keep it on your company drive, email, or wherever you store secure documents. That way, casually filling in a worksheet will not lead to a catastrophic information leak.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"font-family:'Fraunces',serif; font-style:italic; font-size:16px; line-height:1.58; max-width:62ch; margin:24px 0 0; color:#5a4a66;\">This worksheet should be filled out when you start a new job or team, or right now. It can even be helpful before an interview to show your interest in an organization. It can be used as a rubric when generating new ideas: does that idea match the goals of your organization?<\u002Fp>\n\n    <div style=\"height:1px; background:#e0d9e6; margin:28px 0 8px;\"><\u002Fdiv>\n\n    <!-- QUESTIONS -->\n    <div data-questions=\"1\"><\u002Fdiv>\n\n    <!-- FOOTER -->\n    <div style=\"margin-top:46px; padding-top:22px; border-top:2px solid #177E89;\">\n      <div style=\"font-family:'Fraunces',serif; font-weight:700; font-size:16px; color:#3A2449;\">Michelle Brenner<\u002Fdiv>\n      <div style=\"margin-top:4px; font-family:'Lato',sans-serif; font-size:12.5px;\"><a href=\"https://www.amazon.com/dp/B0FS7R6MN4\" style=\"color:#177E89; text-decoration:none;\"><span class=\"lk-title\">Software Engineer's Library<\u002Fspan><span class=\"lk-url\">amazon.com/dp/B0FS7R6MN4<\u002Fspan><\u002Fa><\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:7px 18px; margin-top:13px; font-family:'Lato',sans-serif; font-size:12.5px;\">\n        <a href=\"https://www.michellebrenner.com\" style=\"color:#177E89; text-decoration:none;\"><span class=\"lk-title\">Website<\u002Fspan><span class=\"lk-url\">michellebrenner.com<\u002Fspan><\u002Fa>\n        <span style=\"color:#cdd5da;\">·<\u002Fspan>\n        <a href=\"https://linkedin.com/in/michellebrenner\" style=\"color:#177E89; text-decoration:none;\"><span class=\"lk-title\">LinkedIn<\u002Fspan><span class=\"lk-url\">linkedin.com/in/michellebrenner<\u002Fspan><\u002Fa>\n        <span style=\"color:#cdd5da;\">·<\u002Fspan>\n        <a href=\"https://instagram.com/michellebspeaks\" style=\"color:#177E89; text-decoration:none;\"><span class=\"lk-title\">Instagram<\u002Fspan><span class=\"lk-url\">instagram.com/michellebspeaks<\u002Fspan><\u002Fa>\n        <span style=\"color:#cdd5da;\">·<\u002Fspan>\n        <a href=\"https://github.com/michellelynne/software-engineers-library\" style=\"color:#177E89; text-decoration:none;\"><span class=\"lk-title\">GitHub<\u002Fspan><span class=\"lk-url\">github.com/michellelynne/software-engineers-library<\u002Fspan><\u002Fa>\n        <span style=\"color:#cdd5da;\">·<\u002Fspan>\n        <a href=\"https://discord.gg/C5Cunu2gT\" style=\"color:#177E89; text-decoration:none;\"><span class=\"lk-title\">Discord<\u002Fspan><span class=\"lk-url\">discord.gg/C5Cunu2gT<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;mastheadColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#3A2449&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#3A2449&quot;, &quot;#003049&quot;, &quot;#0f5a62&quot;, &quot;#7a2438&quot;], &quot;section&quot;: &quot;Style&quot; },\n  &quot;showExamples&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Layout&quot; }\n}\">\nclass Component extends DCLogic {\n  componentDidMount(){\n    this.key = 'ssl-org-context-v1';\n    const root = document.getElementById('ws-root');\n    if(!root) return;\n    let saved = {};\n    try{ saved = JSON.parse(localStorage.getItem(this.key) || '{}'); }catch(e){}\n    this.buildQuestions(root, saved);\n    Object.entries(saved).forEach(([n,v])=>{\n      const el = root.querySelector('.save[name=\"'+n+'\"]');\n      if(el) el.value = v;\n    });\n    const update = () => {\n      const groups = {};\n      root.querySelectorAll('.save').forEach(el=>{ const q = el.name.split('-')[0]; if(!groups[q]) groups[q] = false; if(el.value && el.value.trim()) groups[q] = true; });\n      const answered = Object.values(groups).filter(Boolean).length;\n      const c = document.getElementById('ws-count');\n      if(c) c.textContent = answered + ' of 20 answered';\n    };\n    this._save = () => {\n      const o = {};\n      root.querySelectorAll('.save').forEach(el=>{ if(el.value && el.value.trim()) o[el.name]=el.value; });\n      try{ localStorage.setItem(this.key, JSON.stringify(o)); }catch(e){}\n      update();\n    };\n    root.addEventListener('input', this._save);\n    update();\n    this.applyTweaks();\n  }\n  componentDidUpdate(){ this.applyTweaks(); }\n  applyTweaks(){\n    const root = document.getElementById('ws-root');\n    if(!root) return;\n    const p = this.props || {};\n    const mast = document.getElementById('ws-masthead');\n    if(mast) mast.style.background = p.mastheadColor || '#3A2449';\n    const showEx = p.showExamples !== false;\n    root.querySelectorAll('[data-example]').forEach(el=>{ el.style.display = showEx ? '' : 'none'; });\n  }\n  area(q, lines){\n    return '<textarea class=\"save\" name=\"q'+q+'-a\" rows=\"'+(lines||2)+'\" style=\"width:100%; border:1.5px solid #cdd5da; border-radius:5px; background:#fff; font-family:\\'Lato\\',sans-serif; font-size:14px; line-height:1.5; color:#3A2449; padding:9px 11px; outline:none; box-sizing:border-box; resize:vertical;\"><\u002Ftextarea>';\n  }\n  buildQuestions(root, saved){\n    const host = root.querySelector('[data-questions]');\n    if(!host) return;\n    // [question, exampleOrNote, group]\n    const qs = [\n      ['Is your organization a non-profit, for-profit, or government entity?', '', 'A'],\n      ['What products or services do they provide?', '', 'A'],\n      ['If for-profit, how do they make revenue?', 'Examples: Subscription, selling a product, freemium.', 'A'],\n      ['If a non-profit or government agency, what is their goal?', '', 'A'],\n      ['Who are their customers?', '', 'B'],\n      ['Is there anyone else using their products who is not a customer?', 'Example: A point-of-sale system is paid for by the store but is used by shoppers.', 'B'],\n      ['What metrics do they use to judge company health?', 'Examples: Customer acquisition, churn rate, EBITDA (Earnings Before Interest, Taxes, Depreciation, and Amortization).', 'B'],\n      ['What were the goals for those metrics last quarter?', 'Example: For 2024 Q1, the goal was to add 1,000 customers.', 'B'],\n      ['What were the results of those metrics last quarter?', 'Example: For 2024 Q1, we acquired 750 customers.', 'B'],\n      ['What division are you in?', 'This is usually multiple teams with a single focus, run by a vice president or director.', 'C'],\n      ['How does your division contribute to the company metrics?', '', 'C'],\n      ['Does your division have any quarterly or yearly goals?', '', 'C'],\n      ['What is the name of your team?', '', 'D'],\n      ['How does your team contribute to the company metrics?', '', 'D'],\n      ['How does your team contribute to the division goals?', '', 'D'],\n      ['Does your team have any quarterly or yearly goals?', '', 'D'],\n      ['Are you on any sub-team or squad within your team?', '', 'E'],\n      ['What software product(s) do you contribute to, design, or maintain?', '', 'E'],\n      ['How do those products fit the team, division, and company goals?', '', 'E'],\n      ['Do you have any personal technical growth goals?', 'Example: I would like to learn more about data science next.', 'E']\n    ];\n    const groupTitles = {\n      A: 'The Company',\n      B: 'Customers & Metrics',\n      C: 'Your Division',\n      D: 'Your Team',\n      E: 'You & Your Products'\n    };\n    let h = '';\n    let lastGroup = null;\n    qs.forEach((row, idx)=>{\n      const n = idx + 1;\n      if(row[2] !== lastGroup){\n        lastGroup = row[2];\n        h += '<div style=\"display:flex; align-items:baseline; gap:13px; margin:'+(idx===0?'24px':'38px')+' 0 14px;\">'+\n               '<span style=\"font-family:\\'Bebas Neue\\',sans-serif; font-size:30px; line-height:.78; color:#9178B5;\">'+row[2]+'<\u002Fspan>'+\n               '<span style=\"font-family:\\'Fraunces\\',serif; font-weight:600; font-size:21px; color:#3A2449;\">'+groupTitles[row[2]]+'<\u002Fspan>'+\n             '<\u002Fdiv>';\n      }\n      h += '<div class=\"q\" style=\"margin-bottom:20px;\">'+\n             '<div style=\"display:flex; gap:11px; align-items:baseline;\">'+\n               '<span style=\"font-family:\\'Montserrat\\',sans-serif; font-weight:700; font-size:14px; color:#9178B5; flex:none; width:24px;\">'+n+'.<\u002Fspan>'+\n               '<div style=\"flex:1;\">'+\n                 '<div style=\"font-family:\\'Montserrat\\',sans-serif; font-weight:600; font-size:15px; line-height:1.4; color:#3A2449; margin-bottom:'+(row[1]?'4px':'8px')+';\">'+row[0]+'<\u002Fdiv>'+\n                 (row[1] ? '<div data-example=\"1\" style=\"font-family:\\'Fraunces\\',serif; font-style:italic; font-size:12.5px; line-height:1.45; color:#8a7a96; margin-bottom:8px;\">'+row[1]+'<\u002Fdiv>' : '')+\n                 this.area(n, 2)+\n               '<\u002Fdiv>'+\n             '<\u002Fdiv>'+\n           '<\u002Fdiv>';\n    });\n    host.innerHTML = h;\n  }\n  renderVals(){\n    return {\n      doPrint: () => window.print(),\n      clearAll: () => {\n        if(!window.confirm('Clear all your answers on this worksheet?')) return;\n        try{ localStorage.removeItem(this.key); }catch(e){}\n        const root = document.getElementById('ws-root');\n        if(root){\n          root.querySelectorAll('.save').forEach(el=> el.value='');\n          if(this._save) this._save();\n        }\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
